# Omer - the daily LIVE check (Codex release 9, topic 10). Owner console 2026-10-30: "מאשר לעומר פתח כניסה מיוחד בשרת, רק לשני חשבונות
# הבדיקה ..." + decisions 17-20 (the two test accounts only; login and pages, no purchase; fingerprints only, no screenshots; a 10 USD
# monthly cap, exact GitHub permissions, no general admin key).
#  - Triggers: the daily schedule and a manual / agents-room dispatch only - never a pull request or a fork (no secret reaches them).
#  - The job reads the repository (contents: read) and nothing else; it holds no database or admin key. Its two secrets live in the
#    protected `live-check` Environment (deployment branch policy: main only): LIVE_CHECK_URL (the live-check function address) and
#    LIVE_CHECK_SECRET (the same value as the function secret).
#  - One job at a time (concurrency), 30 minutes at most (Linux: at most 30 x 30 x 0.006 = 5.40 USD a month, under the 10 USD cap).
#  - RUN_ID is passed as an environment value (never pasted into a shell line).
name: daily-live-check

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The agents room run id (a manual run or the manager chain); empty = a scheduled run'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: daily-live-check
  cancel-in-progress: false

jobs:
  live-check:
    name: daily LIVE check (Omer)
    if: github.repository == 'quotecode-dev/quotecode-clean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: live-check
    steps:
      - name: checkout (the runner script only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/live-check
      - name: install the browser (outside the app's dependencies; the committed lock file pins every package)
        run: |
          mkdir -p "$RUNNER_TEMP/lc"
          cp scripts/live-check/runner.mjs scripts/live-check/package.json scripts/live-check/package-lock.json "$RUNNER_TEMP/lc/"
          cd "$RUNNER_TEMP/lc"
          npm ci --no-audit --no-fund > /dev/null
          npx playwright install --with-deps chromium > /dev/null
      - name: run the check
        working-directory: ${{ runner.temp }}/lc
        env:
          LIVE_CHECK_URL: ${{ secrets.LIVE_CHECK_URL }}
          LIVE_CHECK_SECRET: ${{ secrets.LIVE_CHECK_SECRET }}
          RUN_ID: ${{ inputs.run_id }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: node runner.mjs
