
[functions.chat-ai]
enabled = true
verify_jwt = true
import_map = "./functions/chat-ai/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/chat-ai/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/chat-ai/*.html" ]

[functions.admin-delete-user]
enabled = true
verify_jwt = true
import_map = "./functions/admin-delete-user/deno.json"
entrypoint = "./functions/admin-delete-user/index.ts"

[functions.send-trial-expiration-email]
enabled = true
# verify_jwt=false בכוונה: הקוד עצמו (לא השער) אוכף הרשאות לפי מצב - batch
# דורש CRON_SECRET, test דורש super_admin JWT לכל כתובת חוץ משתי כתובות
# בדיקה מוחרגות במפורש. עם verify_jwt=true השער היה חוסם כל בקשה ללא
# Authorization header עוד לפני שהקוד שלנו מקבל הזדמנות להחריג אותן.
verify_jwt = false
entrypoint = "./functions/send-trial-expiration-email/index.ts"

[functions.send-subscription-expiration-email]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-subscription-expiration-email/index.ts"

[functions.send-quote-email]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-quote-email/index.ts"

[functions.resend-email-webhook]
enabled = true
# verify_jwt=false בכוונה: זו קריאה חיצונית מ-Resend, לא מ-Supabase Auth -
# האימות היחיד הוא חתימת ה-Webhook (svix-id/svix-timestamp/svix-signature)
# מול RESEND_WEBHOOK_SECRET, הנבדקת בתוך הקוד עצמו
verify_jwt = false
entrypoint = "./functions/resend-email-webhook/index.ts"

[functions.billing-checkout-stub]
enabled = true
# שלד (stub) לחיוב עתידי - עדיין נדרש JWT תקין בשער בנוסף לבדיקת הבעלות
# הפנימית, אין סיבה להנמיך את זה כמו הפונקציות שנקראות ע"י גורם חיצוני
verify_jwt = true
entrypoint = "./functions/billing-checkout-stub/index.ts"

[functions.get-public-quote]
enabled = true
# verify_jwt=false בכוונה: זו נקודת הגישה הציבורית/אנונימית להצעת מחיר -
# מבקר ללא Authorization header תקין חייב להצליח לטעון אותה. השער עם
# verify_jwt=true היה חוסם כל בקשה עם טוקן חסר/פגום עוד לפני שהקוד שלנו
# מקבל הזדמנות להתעלם ממנה בבטחה (owner detection הוא best-effort בלבד -
# ר' get-public-quote/index.ts). גבול האבטחה בפועל הוא בקוד הפונקציה עצמו:
# quote_id בלבד, אימות UUID, service_role בצד שרת בלבד, allowlist מפורש
# לתגובה, ואין כתיבות DB.
verify_jwt = false
entrypoint = "./functions/get-public-quote/index.ts"
